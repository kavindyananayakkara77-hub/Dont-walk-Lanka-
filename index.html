<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dont Walk Lanka</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0812" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; background:#0b0812; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const ROUTES = [
  { id: "138", type: "bus", from: "Colombo Fort", to: "Negombo", depart: "12:30 PM", arrive: "1:45 AM", baseDelay: 6 },
  { id: "240", type: "bus", from: "Colombo Fort", to: "Negombo", depart: "12:50 PM", arrive: "1:55 AM", baseDelay: 18 },
  { id: "IC-04", type: "train", from: "Colombo Fort", to: "Negombo", depart: "1:05 PM", arrive: "1:40 AM", baseDelay: 0 },
];

const PATH = [
  { name: "Colombo Fort", pct: 0 },
  { name: "Wellawatte", pct: 22 },
  { name: "Dehiwala", pct: 40 },
  { name: "Ja-Ela", pct: 66 },
  { name: "Kolupitiya Jn", pct: 84 },
  { name: "Negombo", pct: 100 },
];

function delayStatus(mins) {
  if (mins === 0) return { label: "On Time", tone: "ok" };
  if (mins <= 8) return { label: `Minor Delay · ${mins} min`, tone: "warn" };
  return { label: `Major Delay · ${mins} min`, tone: "bad" };
}

const toneStyles = {
  ok: "text-emerald-400 bg-emerald-400/10 border-emerald-400/30",
  warn: "text-amber-400 bg-amber-400/10 border-amber-400/30",
  bad: "text-rose-400 bg-rose-400/10 border-rose-400/30",
};

function Icon({ name, className }) {
  const paths = {
    home: "M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10",
    search: "M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-4.35-4.35",
    ticket: "M4 8a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-4V8z",
    bell: "M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9",
    user: "M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c1.5-4 5-6 8-6s6.5 2 8 6",
    bus: "M4 17h16M4 17V6a1 1 0 011-1h14a1 1 0 011 1v11M4 17a2 2 0 004 0M16 17a2 2 0 004 0M7 10h10",
    train: "M6 3h12a2 2 0 012 2v9a4 4 0 01-4 4H8a4 4 0 01-4-4V5a2 2 0 012-2zM6 15l-2 5M18 15l2 5M9 8h6M4 11h16",
    pin: "M12 21s7-6.5 7-11a7 7 0 10-14 0c0 4.5 7 11 7 11zM12 12a2 2 0 100-4 2 2 0 000 4z",
    nav: "M3 11l18-8-8 18-2-8-8-2z",
    clock: "M12 8v4l3 3M12 21a9 9 0 100-18 9 9 0 000 18z",
    check: "M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z",
    radio: "M12 12a1 1 0 100-2 1 1 0 000 2zM7 12a5 5 0 015-5m5 5a5 5 0 01-5 5M4 12a8 8 0 018-8m8 8a8 8 0 01-8 8",
    chevleft: "M15 18l-6-6 6-6",
    footprints: "M8 6a2 2 0 100 4 2 2 0 000-4zM8 12v6M16 10a2 2 0 100 4 2 2 0 000-4zM16 16v4",
    loader: "M12 2v4m0 12v4m10-10h-4M6 12H2m15.5-6.5l-2.8 2.8M9.3 14.7l-2.8 2.8m0-11l2.8 2.8m6.4 6.4l2.8 2.8",
  };
  return (
    <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d={paths[name]} />
    </svg>
  );
}

function TicketCode({ seed, size = 132 }) {
  const cells = 11;
  const grid = [];
  let s = 0;
  for (let i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  const rand = () => { s = (s * 1103515245 + 12345) >>> 0; return (s >>> 8) / 16777216; };
  for (let i = 0; i < cells * cells; i++) grid.push(rand() > 0.52);
  const cellSize = size / cells;
  return (
    <svg width={size} height={size} className="rounded-md" style={{ background: "#fdf8f0" }}>
      {grid.map((on, i) => {
        const x = (i % cells) * cellSize, y = Math.floor(i / cells) * cellSize;
        const r = Math.floor(i / cells), c = i % cells;
        const isFinder = (r < 3 && c < 3) || (r < 3 && c > cells - 4) || (r > cells - 4 && c < 3);
        if (isFinder) return null;
        return on ? <rect key={i} x={x} y={y} width={cellSize} height={cellSize} fill="#1a1420" /> : null;
      })}
      {[[0, 0], [0, cells - 3], [cells - 3, 0]].map(([r, c], idx) => (
        <g key={idx}>
          <rect x={c * cellSize} y={r * cellSize} width={cellSize * 3} height={cellSize * 3} fill="#1a1420" />
          <rect x={(c + 0.6) * cellSize} y={(r + 0.6) * cellSize} width={cellSize * 1.8} height={cellSize * 1.8} fill="#fdf8f0" />
          <rect x={(c + 1.1) * cellSize} y={(r + 1.1) * cellSize} width={cellSize * 0.8} height={cellSize * 0.8} fill="#1a1420" />
        </g>
      ))}
    </svg>
  );
}

function Badge({ tone, children }) {
  return <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border ${toneStyles[tone]}`}>{children}</span>;
}
function Card({ children, className = "" }) {
  return <div className={`rounded-2xl border border-white/8 bg-[#171225]/80 backdrop-blur p-4 ${className}`}>{children}</div>;
}

function App() {
  const [tab, setTab] = useState("home");
  const [query, setQuery] = useState("");
  const [selectedRoute, setSelectedRoute] = useState(ROUTES[0]);
  const [progress, setProgress] = useState(14);
  const [location, setLocation] = useState(null);
  const [locStatus, setLocStatus] = useState("idle");
  const [tickets, setTickets] = useState(() => {
    try { return JSON.parse(localStorage.getItem("dwl_tickets") || "[]"); } catch (e) { return []; }
  });
  const [ticketSubtab, setTicketSubtab] = useState("buy");
  const [now, setNow] = useState(Date.now());
  const intervalRef = useRef(null);

  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => {
    clearInterval(intervalRef.current);
    intervalRef.current = setInterval(() => setProgress((p) => (p >= 100 ? 4 : p + 0.6)), 1200);
    return () => clearInterval(intervalRef.current);
  }, [selectedRoute]);

  const persistTickets = useCallback((next) => {
    setTickets(next);
    localStorage.setItem("dwl_tickets", JSON.stringify(next));
  }, []);

  const useMyLocation = () => {
    if (!navigator.geolocation) { setLocStatus("error"); return; }
    setLocStatus("loading");
    navigator.geolocation.getCurrentPosition(
      (pos) => { setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }); setLocStatus("ok"); },
      () => setLocStatus("error"),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  const buyTicket = (route) => {
    const id = `DWL-${route.id}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
    const validUntil = new Date(Date.now() + 3 * 60 * 60 * 1000);
    const ticket = { id, routeId: route.id, type: route.type, from: route.from, to: route.to, boughtAt: Date.now(), validUntil: validUntil.toISOString(), status: "active" };
    persistTickets([ticket, ...tickets]);
    setTicketSubtab("mine");
  };

  const currentStop = PATH.reduce((acc, s) => (progress >= s.pct ? s : acc), PATH[0]);
  const nextStopIdx = Math.min(PATH.findIndex((s) => s.pct > progress), PATH.length - 1);
  const nextStop = PATH[nextStopIdx === -1 ? PATH.length - 1 : nextStopIdx];
  const etaMins = Math.max(1, Math.round(((nextStop.pct - progress) / 100) * 55));
  const status = delayStatus(selectedRoute.baseDelay);
  const activeTicket = tickets.find((t) => t.status === "active");
  const pastTickets = tickets.filter((t) => t.status !== "active");

  return (
    <div className="min-h-screen w-full flex items-center justify-center bg-[#0b0812] p-4" style={{ fontFamily: "system-ui, sans-serif" }}>
      <div className="w-full max-w-sm h-[95vh] rounded-[2.2rem] border border-white/10 overflow-hidden relative shadow-2xl flex flex-col" style={{ background: "radial-gradient(120% 90% at 10% -10%, #241633 0%, #0b0812 55%)" }}>
        <div className="flex items-center justify-between px-6 pt-3 pb-1 text-[11px] text-white/50">
          <span>{new Date(now).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
          <span className="tracking-wider">DONT WALK LANKA</span>
        </div>
        <div className="px-5 pt-2 pb-4 flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: "linear-gradient(135deg,#ff6a3d,#ffb13d)" }}>
            <Icon name="footprints" className="w-5 h-5 text-[#1a0f08]" />
          </div>
          <div>
            <div className="text-white font-extrabold text-lg leading-none tracking-tight">Dont Walk Lanka</div>
            <div className="text-[10px] text-white/40 tracking-[0.2em] mt-0.5">TRANSPORTATION REIMAGINED</div>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto px-5 pb-3 space-y-4">
          {tab === "home" && (
            <>
              <button onClick={() => setTab("routes")} className="w-full flex items-center gap-3 rounded-2xl border border-white/10 bg-white/[0.04] px-4 py-3 text-left">
                <Icon name="search" className="w-4 h-4 text-orange-400" />
                <span className="text-white/60 text-sm">Where are you going?</span>
              </button>
              <Card>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-full flex items-center justify-center bg-orange-500/15"><Icon name="pin" className="w-4 h-4 text-orange-400" /></div>
                    <div>
                      <div className="text-white text-sm font-semibold">Pick-Up</div>
                      <div className="text-white/50 text-xs">
                        {locStatus === "ok" && location ? `${location.lat.toFixed(4)}, ${location.lng.toFixed(4)}` : locStatus === "loading" ? "Finding you…" : locStatus === "error" ? "Location unavailable" : "Current Location"}
                      </div>
                    </div>
                  </div>
                  <button onClick={useMyLocation} className="w-8 h-8 rounded-full bg-orange-500/15 flex items-center justify-center shrink-0">
                    <Icon name={locStatus === "loading" ? "loader" : "nav"} className={`w-4 h-4 text-orange-400 ${locStatus === "loading" ? "animate-spin" : ""}`} />
                  </button>
                </div>
              </Card>
              <div className="grid grid-cols-2 gap-3">
                <div className="rounded-2xl border border-orange-400/30 bg-orange-500/10 py-3 flex flex-col items-center gap-1"><Icon name="bus" className="w-5 h-5 text-orange-400" /><span className="text-white text-xs font-semibold">Bus</span></div>
                <div className="rounded-2xl border border-white/10 bg-white/[0.03] py-3 flex flex-col items-center gap-1"><Icon name="train" className="w-5 h-5 text-white/70" /><span className="text-white text-xs font-semibold">Train</span></div>
              </div>
              <Card>
                <div className="flex items-center justify-between mb-2"><span className="text-white text-sm font-semibold">Next Bus Near You</span><Badge tone="warn">2 mins</Badge></div>
                <div className="text-white/70 text-xs mb-1">Colombo Fort → Negombo</div>
                <div className="text-white/40 text-[11px]">Route 138 · every 15–20 min, 6 AM – 9 PM</div>
              </Card>
              <button onClick={() => setTab("live")} className="w-full rounded-2xl py-3 font-bold text-[#1a0f08] text-sm" style={{ background: "linear-gradient(135deg,#ff6a3d,#ffb13d)" }}>Track Live Status</button>
            </>
          )}

          {tab === "routes" && (
            <>
              <div className="flex items-center gap-2 rounded-2xl border border-white/10 bg-white/[0.04] px-3 py-2.5">
                <Icon name="search" className="w-4 h-4 text-white/40" />
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search Colombo Fort → Negombo" className="bg-transparent outline-none text-sm text-white placeholder-white/30 flex-1" />
              </div>
              <div className="space-y-3">
                {ROUTES.map((r) => {
                  const st = delayStatus(r.baseDelay);
                  return (
                    <button key={r.id} onClick={() => { setSelectedRoute(r); setProgress(14); setTab("live"); }} className="w-full text-left">
                      <Card className={selectedRoute.id === r.id ? "border-orange-400/40" : ""}>
                        <div className="flex items-start justify-between">
                          <div className="flex items-center gap-2">
                            <Icon name={r.type === "bus" ? "bus" : "train"} className="w-4 h-4 text-orange-400" />
                            <span className="text-white font-semibold text-sm">{r.type === "bus" ? `Route ${r.id}` : `Intercity ${r.id}`}</span>
                          </div>
                          <Badge tone={st.tone}>{st.label}</Badge>
                        </div>
                        <div className="text-white/60 text-xs mt-2">{r.depart} — {r.arrive}</div>
                        <div className="text-white/35 text-[11px] mt-0.5">{r.from} → {r.to}</div>
                      </Card>
                    </button>
                  );
                })}
              </div>
            </>
          )}

          {tab === "live" && (
            <>
              <div className="flex items-center gap-2 text-white/70 text-sm font-semibold mb-1">
                <button onClick={() => setTab("routes")}><Icon name="chevleft" className="w-4 h-4" /></button>
                Live Status · {selectedRoute.type === "bus" ? `Route ${selectedRoute.id}` : `Intercity ${selectedRoute.id}`}
              </div>
              <Card>
                <div className="flex items-center gap-1.5 text-emerald-400 text-[11px] font-semibold mb-3"><Icon name="radio" className="w-3 h-3 animate-pulse" /> LIVE</div>
                <div className="relative h-2 rounded-full bg-white/10 mb-1">
                  <div className="absolute inset-y-0 left-0 rounded-full transition-all duration-1000" style={{ width: `${progress}%`, background: "linear-gradient(90deg,#ff6a3d,#ffb13d)" }} />
                  <div className="absolute -top-2 transition-all duration-1000" style={{ left: `calc(${progress}% - 8px)` }}>
                    <div className="w-5 h-5 rounded-full flex items-center justify-center shadow-lg" style={{ background: "linear-gradient(135deg,#ff6a3d,#ffb13d)" }}>
                      <Icon name={selectedRoute.type === "bus" ? "bus" : "train"} className="w-3 h-3 text-[#1a0f08]" />
                    </div>
                  </div>
                </div>
                <div className="flex justify-between text-[10px] text-white/35 mb-4"><span>{PATH[0].name}</span><span>{PATH[PATH.length - 1].name}</span></div>
                <div className="rounded-xl bg-white/[0.04] border border-white/10 px-3 py-2.5 flex items-center justify-between mb-2">
                  <div><div className="text-white text-sm font-semibold">{currentStop.name}</div><div className="text-white/40 text-[11px]">Current Stop</div></div>
                  <Icon name="check" className="w-4 h-4 text-emerald-400" />
                </div>
                <div className="rounded-xl bg-orange-500/10 border border-orange-400/25 px-3 py-2.5 flex items-center justify-between">
                  <div><div className="text-white text-sm font-semibold">{nextStop.name}</div><div className="text-white/40 text-[11px]">Next Stop · ETA {etaMins} min</div></div>
                  <Icon name="clock" className="w-4 h-4 text-orange-400" />
                </div>
              </Card>
              <Card>
                <div className="flex items-center justify-between mb-1"><span className="text-white text-sm font-semibold">Status</span><Badge tone={status.tone}>{status.label}</Badge></div>
                <p className="text-white/40 text-[11px] leading-relaxed">{status.tone === "ok" ? "Running on schedule. No action needed." : "Delay caused by traffic near the current stop. Estimates update automatically."}</p>
              </Card>
              {location && (
                <Card>
                  <div className="flex items-center gap-2 text-white text-sm font-semibold mb-1"><Icon name="pin" className="w-4 h-4 text-orange-400" /> Your Location</div>
                  <div className="text-white/40 text-[11px]">Lat {location.lat.toFixed(5)}, Lng {location.lng.toFixed(5)} (±{Math.round(location.accuracy)}m)</div>
                </Card>
              )}
            </>
          )}

          {tab === "tickets" && (
            <>
              <div className="flex rounded-2xl border border-white/10 overflow-hidden">
                {["buy", "mine"].map((k) => (
                  <button key={k} onClick={() => setTicketSubtab(k)} className={`flex-1 py-2.5 text-sm font-semibold ${ticketSubtab === k ? "text-[#1a0f08]" : "text-white/50"}`} style={ticketSubtab === k ? { background: "linear-gradient(135deg,#ff6a3d,#ffb13d)" } : {}}>
                    {k === "buy" ? "Buy Ticket" : "My Tickets"}
                  </button>
                ))}
              </div>
              {ticketSubtab === "buy" && (
                <div className="space-y-3 pt-1">
                  {ROUTES.map((r) => (
                    <Card key={r.id}>
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <Icon name={r.type === "bus" ? "bus" : "train"} className="w-4 h-4 text-orange-400" />
                          <div><div className="text-white text-sm font-semibold">{r.type === "bus" ? `Route ${r.id}` : `Intercity ${r.id}`}</div><div className="text-white/40 text-[11px]">{r.from} → {r.to} · {r.depart}</div></div>
                        </div>
                        <button onClick={() => buyTicket(r)} className="px-3 py-1.5 rounded-full text-xs font-bold text-[#1a0f08]" style={{ background: "linear-gradient(135deg,#ff6a3d,#ffb13d)" }}>Buy</button>
                      </div>
                    </Card>
                  ))}
                </div>
              )}
              {ticketSubtab === "mine" && (
                <div className="space-y-4 pt-1">
                  {activeTicket ? (
                    <Card className="border-orange-400/30">
                      <div className="text-orange-400 text-xs font-bold mb-3 tracking-wide">ACTIVE TICKET</div>
                      <div className="flex gap-4 items-center">
                        <TicketCode seed={activeTicket.id} />
                        <div>
                          <div className="text-white font-bold text-base">{activeTicket.type === "bus" ? `Route ${activeTicket.routeId}` : `Intercity ${activeTicket.routeId}`}</div>
                          <div className="text-white/50 text-xs">{activeTicket.from} → {activeTicket.to}</div>
                          <div className="text-white/35 text-[10px] mt-1">{activeTicket.id}</div>
                          <div className="text-white/35 text-[10px]">Valid until {new Date(activeTicket.validUntil).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
                        </div>
                      </div>
                      <button onClick={() => persistTickets(tickets.map(t => t.id === activeTicket.id ? { ...t, status: "used" } : t))} className="mt-3 w-full text-center text-[11px] text-white/40 underline">Mark as used</button>
                    </Card>
                  ) : <div className="text-white/40 text-xs text-center py-6">No active ticket. Buy one to see it here.</div>}
                  {pastTickets.length > 0 && (
                    <>
                      <div className="text-white/40 text-xs font-semibold px-1">PAST TICKETS</div>
                      {pastTickets.map((t) => (
                        <Card key={t.id} className="opacity-60">
                          <div className="flex items-center justify-between">
                            <div><div className="text-white text-sm font-semibold">{t.type === "bus" ? `Route ${t.routeId}` : `Intercity ${t.routeId}`}</div><div className="text-white/40 text-[11px]">{t.from} → {t.to}</div></div>
                            <span className="text-white/30 text-[10px]">{new Date(t.boughtAt).toLocaleDateString()}</span>
                          </div>
                        </Card>
                      ))}
                    </>
                  )}
                </div>
              )}
            </>
          )}

          {tab === "profile" && (
            <Card>
              <div className="flex items-center gap-3 mb-3">
                <div className="w-12 h-12 rounded-full bg-orange-500/15 flex items-center justify-center"><Icon name="user" className="w-6 h-6 text-orange-400" /></div>
                <div><div className="text-white font-semibold text-sm">Passenger Profile</div><div className="text-white/40 text-xs">{tickets.length} ticket{tickets.length === 1 ? "" : "s"} purchased</div></div>
              </div>
              <div className="text-white/40 text-[11px]">Location permission: {locStatus === "ok" ? "granted" : locStatus === "error" ? "denied / unavailable" : "not requested"}</div>
            </Card>
          )}
        </div>

        <div className="flex justify-between px-3 py-2.5 border-t border-white/10 bg-black/30">
          {[
            { key: "home", icon: "home", label: "Home" },
            { key: "routes", icon: "search", label: "Routes" },
            { key: "tickets", icon: "ticket", label: "Tickets" },
            { key: "live", icon: "bell", label: "Alerts" },
            { key: "profile", icon: "user", label: "Profile" },
          ].map(({ key, icon, label }) => (
            <button key={key} onClick={() => setTab(key)} className="flex flex-col items-center gap-0.5 flex-1">
              <Icon name={icon} className={`w-4 h-4 ${tab === key ? "text-orange-400" : "text-white/35"}`} />
              <span className={`text-[9px] ${tab === key ? "text-orange-400" : "text-white/35"}`}>{label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
